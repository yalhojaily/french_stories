<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petit Carnet</title>
<meta name="description" content="تعلّم أساسيات اللغة الفرنسية في شهر واحد من خلال عشرين قصة قصيرة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Playwrite+FR+Moderne:wght@300;400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home" aria-label="الصفحة الرئيسية">
      <span class="brand-fr" lang="fr" dir="ltr">Petit Carnet</span>
      <span class="brand-ar">دفتر الفرنسية الصغير</span>
    </a>
    <nav class="nav">
      <a href="#home" data-nav="home">المنهج</a>
      <a href="#review" data-nav="review">المراجعة <span class="badge" id="due-badge" hidden></span></a>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="pop-word" hidden>
  <div class="pop-head">
    <div class="pop-fr" dir="ltr" lang="fr">
      <span id="pop-word"></span>
      <span class="chip" id="pop-g" hidden></span>
    </div>
    <button class="icon-btn" id="pop-close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="pop-lemma" id="pop-lemma" hidden></p>
  <p class="pop-ar" id="pop-ar"></p>
  <p class="pop-note" id="pop-note" hidden></p>
  <div class="pop-actions">
    <button class="btn btn-ink" id="pop-say">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      استمع
    </button>
    <button class="btn" id="pop-ctx">في الجملة</button>
    <button class="btn" id="pop-save">احفظ للمراجعة</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<footer class="credit">الأصوات من <a href="https://elevenlabs.io" target="_blank" rel="noopener">ElevenLabs</a></footer>
<!--/APP-->
<script src="data/bundle.js"></script>
<script src="js/app.js"></script>
</body>
</html>
